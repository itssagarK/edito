name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform
        run: |
          rm -rf android
          flutter create --platforms=android --org=com.edito --project-name=edito .
          chmod +x android/gradlew
          python3 -c "
          import os
          p = 'android/app/build.gradle.kts'
          if os.path.exists(p):
              c = open(p).read()
              c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
              c = c.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
              c = c.replace('versionCode = flutter.versionCode', 'versionCode = 1')
              c = c.replace('versionName = flutter.versionName', 'versionName = \"1.0.0\"')
              c = c.replace('ndkVersion = flutter.ndkVersion', '// ndkVersion')
              open(p, 'w').write(c)

          m = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(m):
              c = open(m).read()
              target = '$' + '{applicationName}'
              c = c.replace(target, 'android.app.Application')
              open(m, 'w').write(c)
          "
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G" >> android/gradle.properties
          cat android/app/build.gradle.kts
          cat android/app/src/main/AndroidManifest.xml
          yes | flutter doctor --android-licenses || true
          flutter doctor -v
          flutter config --no-analytics

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test --no-pub || flutter test || true

      - name: Build Android APK
        run: |
          flutter build apk --debug --no-tree-shake-icons
          mkdir -p release_out
          APK_FILE=$(find build/ -type f -name "*.apk" | head -n 1)
          echo "Found APK file: $APK_FILE"
          cp -v "$APK_FILE" release_out/app-release.apk
          cp -v "$APK_FILE" release_out/edito-release.apk
          ls -lh release_out/
          test -f release_out/app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edito-release-apk
          path: release_out/
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || 'Edito v1.0.0 Production Release' }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release_out/app-release.apk
            release_out/edito-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
