name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Toolchain & local.properties
        run: |
          FLUTTER_PATH=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_PATH" > android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties
          chmod +x android/gradlew || true
          yes | flutter doctor --android-licenses || true
          flutter doctor -v
          flutter config --no-analytics

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test --no-pub || flutter test || true

      - name: Build Android APK
        run: |
          chmod +x android/gradlew || true
          flutter build apk --release --no-tree-shake-icons --verbose 2>&1 | tee build_raw.log
          mkdir -p release_out
          cp -v build/app/outputs/flutter-apk/app-release.apk release_out/edito-release.apk
          cp -v build/app/outputs/flutter-apk/app-release.apk release_out/app-release.apk
          ls -lh release_out/

      - name: Dump Build Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG FAILURE TAIL ==="
          tail -n 250 build_raw.log || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edito-release-apk
          path: release_out/edito-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || 'Edito v1.0.0 Production Release' }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release_out/app-release.apk
            release_out/edito-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
