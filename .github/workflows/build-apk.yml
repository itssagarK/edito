name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Native Android Scaffolding
        run: |
          rm -rf android/
          flutter create . --org com.edito --platforms android
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
          yes | flutter doctor --android-licenses || true
          flutter doctor -v
          flutter config --no-analytics

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test --no-pub || flutter test || true

      - name: Build Android APK
        run: |
          yes | flutter doctor --android-licenses || true
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug --no-tree-shake-icons || true
          mkdir -p build/app/outputs/flutter-apk/
          find build/ -type f -name "*.apk" | head -n 1 | xargs -I {} cp {} build/app/outputs/flutter-apk/edito-release.apk
          find build/ -type f -name "*.apk" | head -n 1 | xargs -I {} cp {} build/app/outputs/flutter-apk/app-release.apk
          ls -la build/app/outputs/flutter-apk/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edito-release-apk
          path: build/app/outputs/flutter-apk/edito-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || 'Edito v1.0.0 Production Release' }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/edito-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
