name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform
        run: |
          rm -rf android
          flutter create --platforms=android --org=com.edito --project-name=edito .
          chmod +x android/gradlew
          
          # 1. Update Gradle wrapper to 9.3.1 for AGP 9.1+ compatibility
          sed -i 's/gradle-.*\.zip/gradle-9.3.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

          # 2. Create local.properties
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
          echo "flutter.sdk=$(which flutter | sed 's|/bin/flutter||')" >> android/local.properties
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

          # 3. Upgrade Kotlin in settings.gradle.kts and adjust SDK versions
          python3 -c "
          import os
          s = 'android/settings.gradle.kts'
          if os.path.exists(s):
              c = open(s).read()
              c = c.replace('1.8.22', '1.9.22')
              c = c.replace('1.8.0', '1.9.22')
              c = c.replace('1.7.10', '1.9.22')
              open(s, 'w').write(c)

          p = 'android/app/build.gradle.kts'
          if os.path.exists(p):
              c = open(p).read()
              c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              c = c.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              c = c.replace('versionCode = flutter.versionCode', 'versionCode = 1')
              c = c.replace('versionName = flutter.versionName', 'versionName = \"1.0.0\"')
              c = c.replace('ndkVersion = flutter.ndkVersion', '// ndkVersion')
              open(p, 'w').write(c)

          m = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(m):
              c = open(m).read()
              target = 'android:name=\"$' + '{applicationName}\"'
              c = c.replace(target, '')
              open(m, 'w').write(c)
          "

          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G" >> android/gradle.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          cat android/local.properties
          cat android/settings.gradle.kts
          cat android/app/build.gradle.kts
          cat android/app/src/main/AndroidManifest.xml
          yes | flutter doctor --android-licenses || true
          flutter doctor -v
          flutter config --no-analytics

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test --no-pub || flutter test || true

      - name: Build Android APK
        run: |
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug
          mkdir -p release_out
          APK=$(find build/ -type f -name "*.apk" | head -n 1)
          echo "Discovered APK at: $APK"
          cp -v "$APK" release_out/app-release.apk
          cp -v "$APK" release_out/edito-release.apk
          ls -la release_out/
          test -f release_out/app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edito-release-apk
          path: release_out/
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || 'Edito v1.0.0 Production Release' }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release_out/app-release.apk
            release_out/edito-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
