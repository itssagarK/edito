name: edito
description: "Edito - Professional High-Performance Video Editor for Android"
publish_to: 'none'
version: 1.0.12+13

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # State Management
  flutter_riverpod: ^2.5.1

  # Utilities and Serialization
  uuid: ^4.5.1
  intl: ^0.19.0
  equatable: ^2.0.7
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5

  # Media Selection & Utilities (Phase 1 preparation)
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  video_player: ^2.9.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
