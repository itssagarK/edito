include ':app'

def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
def properties = new Properties()

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }
}

def flutterSdkPath = properties.getProperty("flutter.sdk") ?: System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
if (flutterSdkPath == null) {
    def path = System.getenv("PATH")
    if (path != null) {
        for (String entry : path.split(File.pathSeparator)) {
            def binDir = new File(entry)
            if (new File(binDir, "flutter").exists() || new File(binDir, "flutter.bat").exists()) {
                flutterSdkPath = binDir.parentFile.absolutePath
                break
            }
        }
    }
}
assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
